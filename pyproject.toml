[project]
name = "uma-ladder"
version = "0.1.0"
description = "Community web app for organizing Uma Musume races and tracking seasonal ladders."
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-Login>=0.6,<1.0",
    "Flask-WTF>=1.2,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "python-dotenv>=1.0,<2.0",
    "itsdangerous>=2.1,<3.0",
    "Werkzeug>=3.0,<4.0",
    "Pillow>=12.2,<13.0",
    "gunicorn>=21.0,<24.0",
    "Markdown>=3.5,<4.0",
    "sentry-sdk[flask]>=2.0,<3.0",
    "Flask-Limiter>=3.5,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-flask>=1.3,<2.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uma_ladder*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Not application code, and linting it has only ever produced noise:
#   migrations/  — Alembic-generated revisions, shaped by its template
#   docs/        — one-off Frida scout scripts, kept as a research record
#                  rather than maintained code
exclude = [
    "migrations",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
