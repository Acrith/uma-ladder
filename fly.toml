# fly.toml — Uma Ladder
#
# Provision via:
#   fly launch --no-deploy --copy-config --name <your-app> --org <your-org>
#   fly postgres create --name <your-app>-db
#   fly postgres attach --app <your-app> <your-app>-db
#   fly secrets set SECRET_KEY=$(openssl rand -hex 32) \
#                   GOOGLE_VISION_API_KEY=...
#                   DISCORD_WEBHOOK_*_URL=...
#   fly deploy
#
# Never commit real secrets. fly.toml is checked into the repo.

app = "uma-ladder"
primary_region = "fra"

[build]

[env]
  FLASK_APP = "uma_ladder"
  FLASK_CONFIG = "production"
  TAILWIND_BUILT = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    timeout = "5s"

[[mounts]]
  source = "uma_ladder_uploads"
  destination = "/app/instance"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
