<select id="uma-ban-outfit" name="uma_outfit_id" class="input-base mt-1" {% if not outfits %}disabled{% endif %}>
  {% if not outfits %}
    <option value="">— pick a character first —</option>
  {% else %}
    <option value="">— pick a costume —</option>
    {% for o in outfits %}
      <option value="{{ o.id }}">
        {{ o.display_title }}{% if o.rarity %} · {{ '★' * o.rarity }}{% endif %}
      </option>
    {% endfor %}
  {% endif %}
</select>
