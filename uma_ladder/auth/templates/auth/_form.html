{% macro render_field(field) %}
  <div class="mb-3">
    <label class="block text-sm text-slate-300">{{ field.label.text }}</label>
    {{ field(class="input-base mt-1") }}
    {% if field.errors %}
      <ul class="mt-1 text-xs text-rose-300">
        {% for err in field.errors %}<li>{{ err }}</li>{% endfor %}
      </ul>
    {% endif %}
  </div>
{% endmacro %}
