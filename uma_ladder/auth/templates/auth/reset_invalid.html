{% extends "base.html" %}
{% from "_components.html" import card %}
{% block title %}Invalid reset link · Uma Ladder{% endblock %}
{% block content %}
  <div class="mx-auto max-w-sm">
    {% call card(class="p-6 border-rose-500/30") %}
      <p class="label-eyebrow text-rose-300">Recovery</p>
      <h1 class="mt-1 text-xl font-semibold text-slate-100">Reset link is invalid or expired</h1>
      <p class="mt-3 text-sm text-slate-400">
        <a class="text-cyan-300 hover:text-cyan-200" href="{{ url_for('auth.request_reset') }}">Request a new one</a>.
      </p>
    {% endcall %}
  </div>
{% endblock %}
