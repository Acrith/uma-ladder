{% extends "base.html" %}
{% from "auth/_form.html" import render_field %}
{% block title %}Set new password · Uma Ladder{% endblock %}
{% block content %}
  <h1 class="text-xl font-semibold mb-4">Set new password</h1>
  <form method="post" class="max-w-sm">
    {{ form.hidden_tag() }}
    {{ render_field(form.password) }}
    {{ render_field(form.confirm) }}
    <button type="submit" class="rounded bg-slate-900 px-3 py-1.5 text-white">Update password</button>
  </form>
{% endblock %}
